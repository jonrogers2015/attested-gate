name: Attested Gate

on:
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: jonrogers2015/pr-gatekeeper@v1
        with:
          base-ref: origin/main
          test-glob: 'test_*.py'
          test-command: 'python3 -m pytest'
          github-token: ${{ secrets.GITHUB_TOKEN }}
