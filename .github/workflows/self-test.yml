name: Attested Gate Self-Test

on:
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install test dependencies
        run: pip install pytest --quiet --break-system-packages || pip install pytest --quiet

      - uses: ./
        with:
          base-ref: origin/main
          test-glob: 'demo/base/test_pricing.py'
          test-command: 'python3 -m pytest'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
